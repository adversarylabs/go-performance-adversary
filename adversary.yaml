name: go/performance
version: 0.0.5
description: "Reviews Go for defer-in-loop, per-request clients, hot-path regexp compilation, and quadratic string building."

triggers:
  manual: true
  files_changed:
    - "**/*.go"

detection:
  files:
    - "**/*.go"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
